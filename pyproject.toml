[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gendered-ai-research"
version = "0.1.0"
description = "Reproducible research workflows for studying author representation in AI research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "PyYAML>=6.0",
    "gender-guesser>=0.4.0",
]

[project.optional-dependencies]
analysis = ["pandas>=2.1", "pyarrow>=14.0", "scipy>=1.11", "matplotlib>=3.8"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
