name: Deploy Static Dashboard to GitHub Pages

on:
  schedule:
    - cron: '0 0 1 * *'
  push:
    branches: [main]
    paths-ignore:
      - frontend/public/data/**
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Data Pipeline Dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install duckdb

      - name: Run Python Tests
        run: python -m pytest -q

      - name: Configure Monthly arXiv Window
        run: |
          python - <<'PY'
          from datetime import date, timedelta
          from pathlib import Path
          import yaml

          config_path = Path("config.yaml")
          config = yaml.safe_load(config_path.read_text(encoding="utf-8"))
          end_date = date.today()
          config["experiment"]["date_range"]["start"] = (
              end_date - timedelta(days=30)
          ).isoformat()
          config["experiment"]["date_range"]["end"] = end_date.isoformat()
          Path(".monthly-config.yaml").write_text(
              yaml.safe_dump(config, sort_keys=False), encoding="utf-8"
          )
          PY

      - name: Ingest and Process Monthly arXiv Batch
        run: python main.py --config .monthly-config.yaml --no-plots

      - name: Append Monthly Parquet Batch
        run: python -m src.export.parquet_builder --append

      - name: Persist Updated Parquet Datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/authors_enriched.parquet frontend/public/data/papers.parquet
          if ! git diff --cached --quiet; then
            git commit -m "Update monthly arXiv Parquet datasets" \
              -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Static Site
        working-directory: frontend
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
